# Codemagic CI/CD Build Configuration for NutriFlow

workflows:
  ios-capacitor:
    name: NutriFlow iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    # 1. Environment requirements
    environment:
      node: lts
      xcode: latest # Uses the latest stable macOS/Xcode image
      
      # Set up App Store credentials group (defined in Codemagic dashboard)
      groups:
        - apple_credentials
        
    # 2. Automatically trigger builds on Git pushes to main branch
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    # 3. Compilation script steps
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          
      - name: Sync Web assets to iOS Project
        script: |
          node node_modules/@capacitor/cli/bin/capacitor sync ios
          
      - name: Build and Archive Xcode Project (Unsigned)
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
            
    # 4. Save and expose the compiled App Store project archive
    artifacts:
      - ios/App/build/App.xcarchive
      
    # 5. Automatically send build updates or email completions
    publishing:
      email:
        recipients:
          - lyynk@example.com # Replace with your email to receive build notices
